const courses=[["🟢","Prism Power","Surface area of prisms"],["🔵","Fraction Match","Equivalent fractions and simplification"],["🟡","Operation Thunder","Order of operations"],["🔴","Word Problem Quest","Real-world math"]];let page="welcome",course=0,n=0,ready=false,entries={},hint=0,started=Date.now(),photo=null;const app=document.getElementById("app");let goal={name:"Boffy Challenge",target:10,reward:"1 Boffy card"};let activeQuestion=null,storageWarning=false;let achievementHistory={milestones:[]};
try{
 const d=JSON.parse(localStorage.getItem("pm-progress")||"{}");
 if(d&&typeof d==="object"){
  if(d.goal&&typeof d.goal.name==="string"&&typeof d.goal.reward==="string"&&Number.isInteger(d.goal.target)&&d.goal.target>0)goal=d.goal;
  if(d.achievements&&typeof d.achievements==="object"&&Array.isArray(d.achievements.milestones))achievementHistory=d.achievements;
  if(d.entries&&typeof d.entries==="object"&&!Array.isArray(d.entries)){
   for(const e of Object.values(d.entries)){
    if(!e||!Number.isInteger(e.course)||e.course<0||e.course>3||!Number.isInteger(e.n)||e.n<0||e.n>=(d.version===2?1000:50)||!Number.isFinite(Number(e.answer)))continue;
    const p=d.version===2?problem(e.course,e.n):BoffyQuestions.legacy(e.course,e.n);
    const index=d.version===2?e.n:BoffyQuestions.banks[e.course].findIndex(q=>q.q===p.q);
    if(index<0)continue;
    const key=e.course+"-"+index,correct=Number(e.answer)===p.ans,previous=entries[key];
    const credit=correct&&e.approved?(d.version===2?Math.max(1,Number(e.legacyApprovedCredits)||1):1):0;
    const oldCredit=previous?.legacyApprovedCredits||0;
    if(!previous||(!previous.correct&&correct))entries[key]={course:e.course,n:index,answer:String(e.answer),correct,approved:correct&&e.approved===true};
    if(oldCredit+credit>0){entries[key].approved=true;entries[key].legacyApprovedCredits=oldCredit+credit}
   }
  }
  if(d.version===2&&typeof d.activeQuestion==="string"&&/^[0-3]-[0-9]{1,3}$/.test(d.activeQuestion))activeQuestion=d.activeQuestion;
 }
}catch(e){storageWarning=true}
function save(){try{localStorage.setItem("pm-progress",JSON.stringify({version:2,entries,goal,activeQuestion,achievements:achievementHistory}));storageWarning=false}catch(e){if(!storageWarning)alert("Progress could not be saved on this device. Allow website storage in Safari to keep your work after closing this page.");storageWarning=true}}

function goals(){page="goals";render()}function setGoal(){page="setGoal";render()}function saveGoal(){let name=document.getElementById("gn").value.trim(),reward=document.getElementById("gr").value.trim(),target=Number(document.getElementById("gt").value);if(!name||!reward||!Number.isInteger(target)||target<1){alert("Enter a goal, reward and positive whole-number target.");return}goal={name,reward,target};window.BoffyAchievements?.onGoalChange();save();goals()}const tips=["Did you write every step on its own line? Let your paper tell the story.","Did you solve something in your head? Prove that step with pencil and paper.","Write down the important numbers, units, and operations before calculating.","Do you really need Dad yet? Slow down, rewrite the problem, and check the order.","If a classmate saw your paper, could they follow every step?","Parentheses first! Multiplication and division go left to right; so do addition and subtraction."];function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function problem(c,i){return BoffyQuestions.banks[c][i]}
function nav(){page="courses";render()}
function completedIn(c){return Object.values(entries).filter(e=>e.course===c&&e.correct).length}
function selectQuestion(c){
 const remaining=BoffyQuestions.banks[c].filter((p,i)=>!entries[c+"-"+i]?.correct);
 if(!remaining.length){page="complete";activeQuestion=null;save();return}
 const alternatives=remaining.filter(p=>p.id!==activeQuestion);
 const pool=alternatives.length?alternatives:remaining;
 const selected=pool[Math.floor(Math.random()*pool.length)];
 n=Number(selected.id.split("-")[1]);activeQuestion=selected.id;hint=0;page="question";save()
}
function choose(c){
 course=c;
 if(activeQuestion?.startsWith(c+"-")&&!entries[activeQuestion]?.correct){n=Number(activeQuestion.split("-")[1]);page="question";hint=0}
 else selectQuestion(c);
 render()
}
function showHelp(){hint++;document.getElementById("help").textContent="🦥 Boffy says: "+tips[(hint-1)%tips.length]}
function record(){
 if(page!=="question"||entries[course+"-"+n]?.correct)return;
 const p=problem(course,n),field=document.getElementById("answer"),v=field.value.trim();
 if(!v||!Number.isFinite(Number(v))){alert("Enter a finite numerical answer first. Keep your handwritten steps on paper for Dad.");return}
 entries[course+"-"+n]={course,n,answer:v,correct:Math.abs(Number(v)-p.ans)<1e-9,approved:false};
 page="feedback";window.BoffyAchievements?.onCorrect(course);save();render()
}
function next(){selectQuestion(course);render()}
function quit(){page="quit";render()}function review(){page="review";render()}function approve(k){if(!entries[k].correct){alert("Only correct answers earn credit.");return}entries[k].approved=true;save();render()}function render(){}
