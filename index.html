const courses=[["🟢","Prism Power","Surface area of prisms"],["🔵","Fraction Match","Equivalent fractions and simplification"],["🟡","Operation Thunder","Order of operations"],["🔴","Word Problem Quest","Real-world math"]];let page="welcome",course=0,n=0,ready=false,entries={},hint=0,started=Date.now(),photo=null;const app=document.getElementById("app");let goal={name:"Boffy Challenge",target:10,reward:"1 Boffy card"};try{let d=JSON.parse(localStorage.getItem("pm-progress")||"{}");entries=d.entries||{};goal=d.goal||goal}catch(e){}function save(){try{localStorage.setItem("pm-progress",JSON.stringify({entries,goal}))}catch(e){}}function goals(){page="goals";render()}function setGoal(){page="setGoal";render()}function saveGoal(){let name=document.getElementById("gn").value.trim(),reward=document.getElementById("gr").value.trim(),target=Number(document.getElementById("gt").value);if(!name||!reward||!Number.isInteger(target)||target<1){alert("Enter a goal, reward and positive whole-number target.");return}goal={name,reward,target};save();goals()}const tips=["Did you write every step on its own line? Let your paper tell the story.","Did you solve something in your head? Prove that step with pencil and paper.","Write down the important numbers, units, and operations before calculating.","Do you really need Dad yet? Slow down, rewrite the problem, and check the order.","If a classmate saw your paper, could they follow every step?","Parentheses first! Multiplication and division go left to right; so do addition and subtraction."];function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function nav(){page="courses";render()}function choose(c){course=c;n=0;page="question";render()}function showHelp(){hint++;document.getElementById("help").textContent="🦥 Boffy says: "+tips[(hint-1)%tips.length]}function record(){let p=problem(course,n),v=document.getElementById("answer").value.trim();if(!v){alert("Enter your final answer first. Keep your handwritten steps on paper for Dad.");return}entries[course+"-"+n]={course,n,answer:v,correct:Number(v)===p.ans,approved:false};save();page="feedback";render()}function next(){if(n===49){page="complete"}else{n++;page="question"}render()}function quit(){page="quit";render()}function review(){page="review";render()}function approve(k){if(!entries[k].correct){alert("Only correct answers earn credit.");return}entries[k].approved=true;save();render()}function render(){let done=Object.values(entries),approved=done.filter(x=>x.approved&&x.correct).length;if(page==="goals"){let left=Math.max(0,goal.target-approved),pct=Math.min(100,Math.round(approved/goal.target*100));app.innerHTML='<div class="panel" style="text-align:center;min-height:75vh"><h2>🏆 BOFFY GOAL METER</h2><h3>'+esc(goal.name)+'</h3><div style="font-size:36px;color:#ffda35">🎁 '+esc(goal.reward)+'</div><h2>'+approved+' / '+goal.target+' APPROVED</h2><div class="bar" style="height:40px"><div class="fill" style="width:'+pct+'%;background:linear-gradient(90deg,#11c877,#ffe12c)"></div></div><h2>'+pct+'% COMPLETE</h2><h3>'+(left===0?'🎉 GOAL REACHED!':left+' more approved problems to go!')+'</h3><p>Only correct answers reviewed and approved by Dad count.</p><button onclick="nav()">📚 Courses</button> <button class="secondary" onclick="review()">🔒 Dad’s Review</button></div>';return}if(page==="setGoal"){app.innerHTML='<div class="panel"><h2>⚙️ Dad’s Goal Settings</h2><p>Set the reward and number of correctly completed, Dad-approved problems needed.</p><p>Goal name</p><input id="gn" type="text" value="'+esc(goal.name)+'"><p>Approved problems required</p><input id="gt" type="number" min="1" max="10000" value="'+goal.target+'"><p>Reward</p><input id="gr" type="text" value="'+esc(goal.reward)+'"><p>Previously approved problems still count.</p><button onclick="saveGoal()">💾 Save Goal</button> <button class="secondary" onclick="review()">Cancel</button></div>';return}if(page==="friends"){app.innerHTML='<div class="panel"><h2>🦥 Boffy and Friends</h2><div class="friend-grid"><div class="friend"><img class="mascot" src="assets/boffy.svg"><h3>Boffy</h3><p>Hero</p></div><div class="friend"><img class="mascot" src="assets/rocky.svg"><h3>Rocky</h3><p>Builder</p></div><div class="friend"><img class="mascot" src="assets/chilly.svg"><h3>Chilly</h3><p>Thinker</p></div><div class="friend"><img class="mascot" src="assets/sunny.svg"><h3>Sunny</h3><p>Cheerleader</p></div><div class="friend"><img class="mascot" src="assets/zippy.svg"><h3>Zippy</h3><p>Speedster</p></div></div><button onclick="nav()">Back to Quests</button></div>';return}if(page==="welcome"){app.innerHTML='<div class="hero"><img class="mascot" src="assets/boffy.svg" alt="Boffy"><h2>Boffy Math Quest</h2><p class="slogan">REAL MATH · REAL PROGRESS · REAL REWARDS</p><p style="font-size:21px">📜 PAPER + PENCIL FIRST!</p><p>Grab a pencil, eraser, and paper. Show every step before entering your answer!</p><button onclick="ready=true;nav()">🦥 GOT ’EM! LET’S DO MATH ➜</button></div>';return}if(page==="courses"){app.innerHTML='<div class="panel"><h2><span class="poke"></span> Choose Your Quest</h2><p class="muted">Four math adventures · 50 questions per course</p><div class="grid">'+courses.map((c,i)=>'<button class="course" onclick="choose('+i+')"><span style="font-size:32px">'+c[0]+'</span><strong>'+c[1]+'</strong><span class="muted">'+c[2]+'</span><p class="tag">50 questions</p></button>').join("")+'</div></div><div class="panel"><h3>🏆 Trainer Progress</h3><p>'+done.length+' questions submitted · '+approved+' parent-approved · '+Math.floor(approved/10)+' Boffy cards earned</p><div class="reward-meter"><strong>🎴 Boffy Card Rewards</strong><p>Earn 1 physical card for every 10 Dad-approved questions.</p><div class="bar"><div class="fill" style="width:'+(approved%10)*10+'%"></div></div><p>'+(approved%10)+' / 10 toward next card</p></div><button class="secondary" onclick="goals()">🏆 Goal Meter</button> <button class="secondary" onclick="review()">Dad’s Review →</button></div>';return}if(page==="question"){let p=problem(course,n),saved=entries[course+"-"+n];app.innerHTML='<div class="panel"><div class="row" style="justify-content:space-between"><span class="tag">'+courses[course][1]+'</span><span>Question '+(n+1)+' / 50</span></div><div class="bar" style="margin-top:15px"><div class="fill" style="width:'+n*2+'%"></div></div><div class="math">'+esc(p.q)+'</div><p><strong>1.</strong> Write the problem and every step on real paper.</p><p><strong>2.</strong> Enter your final numerical answer.</p><input id="answer" type="number" inputmode="decimal" placeholder="Final answer" value="'+(saved?esc(saved.answer):"")+'"><p class="muted">Keep your written work on paper. Turn it in to Dad when you finish for the night to receive credit.</p><div class="row"><button class="blue" onclick="record()">Submit My Work</button><button class="secondary" onclick="showHelp()">💡 HELP</button><button class="secondary" onclick="quit()">Quit for Tonight</button></div><div id="help" class="help" style="min-height:52px">🦥 Boffy says: Tap HELP for a thinking reminder!</div></div>';return}if(page==="feedback"){let e=entries[course+"-"+n];app.innerHTML='<div class="panel"><h2>'+(e.correct?"🌟 Boffy Cheers! Correct!":"🦥 Boffy says: Try Again!")+'</h2><p>'+(e.correct?"Your final answer is correct. Dad still needs to review your written steps.":"Your final answer needs another look. Check your work line by line.")+'</p><p>✏️ Keep your handwritten work to turn in to Dad at the end of your session.</p><div class="row"><button onclick="next()">Next Question →</button><button class="secondary" onclick="page=\'question\';render()">Retry This Question</button><button class="secondary" onclick="quit()">Quit for Tonight</button></div></div>';return}if(page==="quit"||page==="complete"){app.innerHTML='<div class="panel" style="text-align:center"><h2>'+(page==="quit"?"🌙 Calling It a Night?":"🏆 Course Complete!")+'</h2><p>You have submitted '+done.length+' questions across all courses.</p><div class="help" style="font-size:21px"><strong>📄 Don’t forget!</strong><p>Turn in your handwritten math papers to Dad tonight so your work can be checked and you can earn credit toward Boffy cards!</p></div><p>📨 This is a standalone demo. No email has been sent.</p><button onclick="nav()">Back to Courses</button> <button class="secondary" onclick="setGoal()">⚙️ Set Goal & Reward</button> <button class="secondary" onclick="goals()">🏆 Goal Meter</button></div>';return}if(page==="review"){app.innerHTML='<div class="panel"><h2>📋 Dad’s Review</h2><p class="muted">In the full version, Dad reviews the paper worksheets Wesley turns in. This demo lets Dad mark questions approved after checking the paper.</p><p>'+done.length+' submitted · '+approved+' approved · '+Math.floor(approved/10)+' cards earned</p>'+(done.length?done.map(e=>'<div class="panel" style="background:#f3f8ff"><strong>'+courses[e.course][1]+' — Q'+(e.n+1)+'</strong><p>Answer: '+esc(e.answer)+' · '+(e.correct?"Correct":"Needs retry")+'</p>'+(e.approved?'<span class="tag">Approved ✓</span>':'<button class="blue" onclick="approve(\''+e.course+'-'+e.n+'\')">Approve Work (Demo)</button>')+'</div>').join(""):'<p>No work submitted yet. Start a course to test the workflow.</p>')+'<button onclick="nav()">Back to Courses</button> <button class="secondary" onclick="setGoal()">⚙️ Set Goal & Reward</button> <button class="secondary" onclick="goals()">🏆 Goal Meter</button></div>';return}}render();
