<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PokéMath GO! — Wesley's Demo</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#163253;background:#e4f1ff}*{box-sizing:border-box}body{margin:0}header{background:#155eae;color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{margin:0;color:#ffda45;text-shadow:2px 2px #173c70;font-size:27px}button{border:0;border-radius:12px;padding:13px 19px;font-size:16px;font-weight:750;background:#ffcf38;color:#18375c;cursor:pointer}button.secondary{background:#e0edfc}button.blue{background:#176ad0;color:white}button:disabled{opacity:.45}main{max-width:920px;margin:25px auto;padding:0 15px}.panel{background:white;border-radius:20px;padding:23px;box-shadow:0 5px 18px #154b8318;margin-bottom:15px}.muted{color:#5c7590}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.course{border:2px solid #dce7f5;text-align:left;min-height:145px;background:white}.course strong{display:block;font-size:20px;margin:12px 0}.tag{display:inline-block;background:#ffebaa;border-radius:9px;padding:5px 9px;font-size:13px;font-weight:bold}.math{font-size:30px;font-weight:800;text-align:center;background:#eef6ff;border-radius:15px;padding:32px 10px;margin:18px 0}.bar{height:12px;background:#e4ebf3;border-radius:20px;overflow:hidden}.fill{height:100%;background:#28b96d}input[type=text],input[type=number]{font-size:19px;padding:14px;border:2px solid #c5d7ec;border-radius:10px;width:100%;margin:8px 0 15px}input[type=file]{max-width:100%}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.help{background:#fff2c5;padding:15px;border-radius:12px;margin-top:14px}.notice{background:#e7f8ec;padding:15px;border-radius:12px;margin-top:14px}.photo{max-width:100%;max-height:220px;object-fit:contain;margin-top:12px;border-radius:10px}footer{text-align:center;color:#5b7793;font-size:13px;padding:20px}@media(max-width:600px){.grid{grid-template-columns:1fr}.math{font-size:25px}}</style></head><body><header><h1>⚡ PokéMath GO!</h1><span>Wesley's Math Adventure · DEMO</span><button class="secondary" onclick="review()">🔒 Dad's Review</button></header><main id="app"><div class="panel"><h2>Loading your adventure…</h2></div></main><footer>Demo only · No email · No Mac sync · No uploads to a server</footer><script>
const courses=[["🟢","Prism Power","Surface area of prisms"],["🔵","Fraction Match","Equivalent fractions and simplification"],["🟡","Operation Thunder","Order of operations"],["🔴","Word Problem Quest","Real-world math"]];let page="welcome",course=0,n=0,ready=false,entries={},hint=0,started=Date.now(),photo=null;const app=document.getElementById("app");const tips=["Did you write every step on its own line? Let your paper tell the story.","Did you solve something in your head? Prove that step with pencil and paper.","Write down the important numbers, units, and operations before calculating.","Do you really need Dad yet? Slow down, rewrite the problem, and check the order.","If a classmate saw your paper, could they follow every step?","Parentheses first! Multiplication and division go left to right; so do addition and subtraction."];function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function problem(c,i){let a=3+i%8,b=2+(i*3)%7,d=2+(i*5)%6;if(c===0)return {q:"A rectangular prism measures "+a+" cm × "+b+" cm × "+d+" cm. Find its total surface area.",ans:2*(a*b+a*d+b*d),unit:"cm²"};if(c===1){let x=1+i%5,y=x+2+(i%4),m=2+i%4;return {q:"What number belongs in the blank? "+x+"/"+y+" = "+(x*m)+"/___",ans:y*m,unit:""}}if(c===2)return {q:a+" + "+b+" × ("+d+" + 2) = ?",ans:a+b*(d+2),unit:""};return {q:"Wesley has "+a+" packs with "+b+" cards in each pack. He gives "+d+" cards to a friend. How many cards remain?",ans:a*b-d,unit:"cards"}}
function nav(){page="courses";render()}function choose(c){course=c;n=0;page="question";render()}function showHelp(){hint++;document.getElementById("help").textContent=tips[(hint-1)%tips.length]}function record(){let p=problem(course,n),v=document.getElementById("answer").value.trim(),file=document.getElementById("proof").files[0];if(!v||!file){alert("Enter your answer AND attach a photo of your handwritten work first.");return}entries[course+"-"+n]={course,n,answer:v,correct:Number(v)===p.ans,proof:file.name,approved:false};page="feedback";render()}function next(){if(n===49){page="complete"}else{n++;page="question"}render()}function quit(){page="quit";render()}function review(){page="review";render()}function approve(k){entries[k].approved=true;render()}function render(){let done=Object.values(entries),approved=done.filter(x=>x.approved).length;if(page==="welcome"){app.innerHTML='<div class="panel" style="text-align:center"><div style="font-size:55px">✏️ 📓 📐</div><h2>Hold Up, Trainer!</h2><p>Before catching math skills, grab your pencil, eraser, and paper. Graph paper is even better!</p><p class="muted">Every answer needs handwritten steps. No mental-math shortcuts.</p><button onclick="ready=true;nav()">Got ’em! ✓</button></div>';return}if(page==="courses"){app.innerHTML='<div class="panel"><h2>Choose Your Course</h2><p class="muted">Four math adventures · 50 questions per course</p><div class="grid">'+courses.map((c,i)=>'<button class="course" onclick="choose('+i+')"><span style="font-size:32px">'+c[0]+'</span><strong>'+c[1]+'</strong><span class="muted">'+c[2]+'</span><p class="tag">50 questions</p></button>').join("")+'</div></div><div class="panel"><h3>Trainer Progress</h3><p>'+done.length+' questions submitted · '+approved+' parent-approved · '+Math.floor(approved/10)+' Pokémon cards earned</p><button class="secondary" onclick="review()">Review submissions</button></div>';return}if(page==="question"){let p=problem(course,n),saved=entries[course+"-"+n];app.innerHTML='<div class="panel"><div class="row" style="justify-content:space-between"><span class="tag">'+courses[course][1]+'</span><span>Question '+(n+1)+' / 50</span></div><div class="bar" style="margin-top:15px"><div class="fill" style="width:'+n*2+'%"></div></div><div class="math">'+esc(p.q)+'</div><p><strong>1.</strong> Write the problem and every step on real paper.</p><p><strong>2.</strong> Enter your final numerical answer.</p><input id="answer" type="number" inputmode="decimal" placeholder="Final answer" value="'+(saved?esc(saved.answer):"")+'"><p><strong>3.</strong> Take or choose a photo of your written work.</p><input id="proof" type="file" accept="image/*" capture="environment"><p class="muted" style="font-size:13px">In this public demo, the photo is checked for selection but is not uploaded or retained.</p><div class="row"><button class="blue" onclick="record()">Submit My Work</button><button class="secondary" onclick="showHelp()">💡 HELP</button><button class="secondary" onclick="quit()">Quit for Tonight</button></div><div id="help" class="help" style="min-height:52px">Need help? Tap HELP for a thinking reminder, not the answer.</div></div>';return}if(page==="feedback"){let e=entries[course+"-"+n];app.innerHTML='<div class="panel"><h2>'+(e.correct?"🎉 Correct final answer!":"🔄 Keep Training!")+'</h2><p>'+(e.correct?"Your final answer is correct. Dad still needs to review your written steps.":"Your final answer needs another look. Check your work line by line.")+'</p><p>📷 Proof selected: '+esc(e.proof)+'</p><div class="row"><button onclick="next()">Next Question →</button><button class="secondary" onclick="page=\'question\';render()">Retry This Question</button><button class="secondary" onclick="quit()">Quit for Tonight</button></div></div>';return}if(page==="quit"||page==="complete"){app.innerHTML='<div class="panel" style="text-align:center"><h2>'+(page==="quit"?"🌙 Nice Work Tonight!":"🏆 Course Complete!")+'</h2><p>You have submitted '+done.length+' questions across all courses.</p><p>📨 This is a standalone demo. No email has been sent.</p><button onclick="nav()">Back to Courses</button></div>';return}if(page==="review"){app.innerHTML='<div class="panel"><h2>🔒 Dad’s Review — Demo</h2><p class="muted">In the real Mac version, this area requires a PIN and shows the stored handwriting photos. This public demo does not store photos.</p><p>'+done.length+' submitted · '+approved+' approved · '+Math.floor(approved/10)+' cards earned</p>'+(done.length?done.map(e=>'<div class="panel" style="background:#f3f8ff"><strong>'+courses[e.course][1]+' — Q'+(e.n+1)+'</strong><p>Answer: '+esc(e.answer)+' · '+(e.correct?"Correct":"Needs retry")+' · Photo selected: '+esc(e.proof)+'</p>'+(e.approved?'<span class="tag">Approved ✓</span>':'<button class="blue" onclick="approve(\''+e.course+'-'+e.n+'\')">Approve Work (Demo)</button>')+'</div>').join(""):'<p>No work submitted yet. Start a course to test the workflow.</p>')+'<button onclick="nav()">Back to Courses</button></div>';return}}render();
</script></body></html>
